<!doctype html>
<html lang="en" data-stargazing="gallery-plaster">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stargazing palette</title>
<link rel="stylesheet" href="../dist/stargazing.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#100f0f;color:#f2f0e5;font-family:ui-sans-serif,-apple-system,sans-serif}.page{max-width:1280px;margin:auto;padding:56px 24px}h1{margin:0;font:500 clamp(42px,7vw,80px)/1 Georgia,serif;letter-spacing:-.05em}.intro{max-width:65ch;color:#b7b5ac;line-height:1.6}.families{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:40px}.family{overflow:hidden;border:1px solid #343331;border-radius:12px}.family h2{margin:0;padding:14px;background:#1c1b1a;font-size:13px}.swatch{height:48px;padding:8px 10px;font:10px/1 ui-monospace,monospace}.accents{margin-top:70px}.accent{display:grid;grid-template-columns:100px repeat(13,minmax(36px,1fr));margin-bottom:7px}.accent-name{padding:12px;color:#878580;font:11px ui-monospace,monospace}.chip{height:44px;padding:6px;font:9px ui-monospace,monospace}.demo-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:70px}.demo{padding:24px;border-radius:12px;background:var(--sg-bg);color:var(--sg-tx);border:1px solid var(--sg-ui)}.demo.dark{background:var(--sg-bg);color:var(--sg-tx)}.demo h3{margin:0 0 8px;font:500 24px Georgia,serif}.demo p{font:13px/1.55 Georgia,serif}.muted{color:var(--sg-tx-2)}.faint{color:var(--sg-tx-3);font-size:11px}.demo a{color:var(--sg-cy)}@media(max-width:900px){.families,.demo-grid{grid-template-columns:repeat(2,1fr)}.accent{overflow-x:auto}}@media(max-width:560px){.families,.demo-grid{grid-template-columns:1fr}}
</style></head><body><main class="page"><h1>Stargazing</h1><p class="intro">Complete OKLCH and hex palettes for Soft Parchment, Gallery Plaster, Mineral Paper, and Blue Hour. This page reads generated CSS rather than duplicating palette values.</p><section class="families" id="families"></section><section class="accents"><h2>Flexoki 2 accents</h2><div id="accents"></div></section><section class="demo-grid" id="demos"></section></main><script>
const themes=[['soft-parchment','Soft Parchment'],['gallery-plaster','Gallery Plaster'],['mineral-paper','Mineral Paper'],['blue-hour','Blue Hour']],steps=['paper','base-50','base-100','base-150','base-200','base-300','base-400','base-500','base-600','base-700','base-800','base-850','base-900','base-950','ink'],accentSteps=['50','100','150','200','300','400','500','600','700','800','850','900','950'],accentNames=['red','orange','yellow','green','cyan','blue','purple','magenta'];
const value=(el,name)=>getComputedStyle(el).getPropertyValue(name).trim(),lum=h=>{let c=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return .2126*c[0]+.7152*c[1]+.0722*c[2]},fg=h=>lum(h)>.35?'#100f0f':'#f2f0e5';
for(const [slug,name] of themes){let el=document.createElement('article');el.className='family';el.dataset.stargazing=slug;el.innerHTML=`<h2>${name}</h2>`;families.append(el);el.insertAdjacentHTML('beforeend',steps.map(s=>{let h=value(el,`--sg-${s}`);return `<div class="swatch" style="background:${h};color:${fg(h)}">${s}<br>${h}</div>`}).join(''))}
for(const name of accentNames){let row=document.createElement('div');row.className='accent';row.innerHTML=`<div class="accent-name">${name}</div>`+accentSteps.map(s=>{let h=value(document.documentElement,`--sg-${name}-${s}`);return `<div class="chip" style="background:${h};color:${fg(h)}">${s}</div>`}).join('');accents.append(row)}
for(const [slug,name] of themes)for(const mode of ['light','dark']){let el=document.createElement('article');el.className='demo';el.dataset.stargazing=slug;if(mode==='dark')el.dataset.mode='dark';el.innerHTML=`<h3>${name}</h3><div class="faint">${mode.toUpperCase()} · FAINT METADATA</div><p>Primary body prose always uses <strong>primary text</strong>. Read the <a href="../docs/semantics.md">semantic rules</a>.</p><p class="muted">Muted text supports the prose but never replaces it.</p>`;demos.append(el)}
</script></body></html>
